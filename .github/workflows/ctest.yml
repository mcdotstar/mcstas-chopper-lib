name: C library tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: '${{ github.workflow }} @ ${{ github.event.pull_request.head.label || github.head_ref || github.ref }}'
  cancel-in-progress: true

jobs:
  ctest:
    name: CTest on ${{ matrix.platform }}
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      # The library ships to McStas as source and is compiled by whatever the user has,
      # so it is worth knowing it builds with MSVC as well as with gcc and clang.
      - name: Setup MSVC compilers on Windows
        if: runner.os == 'Windows'
        uses: egor-tensin/vs-shell@v2

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # gcov alone would do, but gcovr turns it into a summary worth reading in a log
      # and a Cobertura file worth uploading.
      - name: Install gcovr
        run: python -m pip install --upgrade pip gcovr

      - name: Configure
        run: cmake -S . -B build -DCHOPPER_LIB_COVERAGE=ON

      - name: Run the tests and report coverage
        run: cmake --build build --target coverage

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: build/coverage
